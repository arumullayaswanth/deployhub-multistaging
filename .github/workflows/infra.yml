name: Infra

on:
  # opened/updated PR -> plan, merged PR -> apply
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]
  # manual button: choose apply or destroy
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: apply
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
  # placeholder image, cd.yml swaps the running task def later
  BOOTSTRAP_IMAGE_TAG: bootstrap

jobs:
  plan:
    name: Plan (staging)
    # any open PR activity, but not when it's being closed/merged
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Terraform init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Check formatting
        run: terraform fmt -check -recursive ../..

      - name: Validate config
        run: terraform validate

      - name: Show the plan
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="$ACCOUNT.dkr.ecr.${AWS_REGION}.amazonaws.com/staging:${BOOTSTRAP_IMAGE_TAG}"
          terraform plan -var="container_image=$IMAGE" -var="alert_email=${{ vars.ALERT_EMAIL }}"

  staging:
    name: ${{ github.event.inputs.action == 'destroy' && 'Destroy' || 'Apply' }} (staging)
    # merged PR -> apply, or manual run -> apply/destroy
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: terraform/environments/staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      # drop old rotation-lambda resources from state if a previous run left them.
      # harmless no-ops when they aren't present.
      - name: Clean stale rotation state
        run: |
          for addr in \
            'module.stack.module.rds.aws_security_group.rotation' \
            'module.stack.module.rds.aws_serverlessapplicationrepository_cloudformation_stack.rotation' \
            'module.stack.module.rds.aws_secretsmanager_secret_rotation.db' \
            'module.stack.module.rds.aws_secretsmanager_secret.db' \
            'module.stack.module.rds.aws_secretsmanager_secret_version.db' \
            'module.stack.module.rds.random_password.db'; do
            terraform state rm "$addr" 2>/dev/null || true
          done

      # a merged PR has no input, so default to apply. only destroy when asked.
      - name: Terraform ${{ github.event.inputs.action || 'apply' }} staging
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="$ACCOUNT.dkr.ecr.${AWS_REGION}.amazonaws.com/staging:${BOOTSTRAP_IMAGE_TAG}"
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            # RDS is slow to terminate, so retry destroy a few times in one run
            # until everything is gone. each pass removes whatever is left.
            for i in 1 2 3 4; do
              echo "== destroy attempt $i =="
              if terraform destroy -auto-approve \
                   -var="container_image=$IMAGE" \
                   -var="alert_email=${{ vars.ALERT_EMAIL }}"; then
                echo "destroy complete"
                break
              fi
              echo "retrying in 60s..."
              sleep 60
            done
          else
            terraform apply -auto-approve \
              -var="container_image=$IMAGE" \
              -var="alert_email=${{ vars.ALERT_EMAIL }}"
          fi

      # send a deployment email through SNS so there's a mail to show in the demo
      - name: Send deployment email
        if: github.event.inputs.action != 'destroy'
        run: |
          TOPIC=$(terraform output -raw sns_topic_arn 2>/dev/null || echo "")
          URL=$(terraform output -raw alb_dns_name 2>/dev/null || echo "")
          if [ -n "$TOPIC" ]; then
            aws sns publish --topic-arn "$TOPIC" \
              --subject "DeployHub staging deployed" \
              --message "Staging deployment finished successfully. App URL: http://$URL  Run: ${{ github.run_id }}" \
              --region ${AWS_REGION}
          fi

      - name: Write staging summary
        if: always()
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            {
              echo "## Staging destroyed"
              echo ""
              echo "All staging resources have been removed. Bill for staging = \$0."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Staging deployed"
              echo ""
              echo "| Resource | Value |"
              echo "|---|---|"
              echo "| App URL | http://$(terraform output -raw alb_dns_name 2>/dev/null) |"
              echo "| ECS cluster | $(terraform output -raw ecs_cluster_name 2>/dev/null) |"
              echo "| DB endpoint | $(terraform output -raw db_endpoint 2>/dev/null) |"
              echo "| App dashboard | $(terraform output -raw app_dashboard 2>/dev/null) |"
              echo "| DB dashboard | $(terraform output -raw db_dashboard 2>/dev/null) |"
              echo ""
              echo "Check health at http://$(terraform output -raw alb_dns_name 2>/dev/null)/health"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  production:
    name: ${{ github.event.inputs.action == 'destroy' && 'Destroy' || 'Apply' }} (production)
    needs: staging
    runs-on: ubuntu-latest
    # required reviewer on this environment is the manual approval gate
    environment: production
    defaults:
      run:
        working-directory: terraform/environments/production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"

      - name: Clean stale rotation state
        run: |
          for addr in \
            'module.stack.module.rds.aws_security_group.rotation' \
            'module.stack.module.rds.aws_serverlessapplicationrepository_cloudformation_stack.rotation' \
            'module.stack.module.rds.aws_secretsmanager_secret_rotation.db' \
            'module.stack.module.rds.aws_secretsmanager_secret.db' \
            'module.stack.module.rds.aws_secretsmanager_secret_version.db' \
            'module.stack.module.rds.random_password.db'; do
            terraform state rm "$addr" 2>/dev/null || true
          done

      - name: Terraform ${{ github.event.inputs.action || 'apply' }} production
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="$ACCOUNT.dkr.ecr.${AWS_REGION}.amazonaws.com/production:${BOOTSTRAP_IMAGE_TAG}"
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            for i in 1 2 3 4; do
              echo "== destroy attempt $i =="
              if terraform destroy -auto-approve \
                   -var="container_image=$IMAGE" \
                   -var="alert_email=${{ vars.ALERT_EMAIL }}"; then
                echo "destroy complete"
                break
              fi
              echo "retrying in 60s..."
              sleep 60
            done
          else
            terraform apply -auto-approve \
              -var="container_image=$IMAGE" \
              -var="alert_email=${{ vars.ALERT_EMAIL }}"
          fi

      - name: Send deployment email
        if: github.event.inputs.action != 'destroy'
        run: |
          TOPIC=$(terraform output -raw sns_topic_arn 2>/dev/null || echo "")
          URL=$(terraform output -raw alb_dns_name 2>/dev/null || echo "")
          if [ -n "$TOPIC" ]; then
            aws sns publish --topic-arn "$TOPIC" \
              --subject "DeployHub production deployed" \
              --message "Production deployment finished successfully. App URL: http://$URL  Run: ${{ github.run_id }}" \
              --region ${AWS_REGION}
          fi

      - name: Write production summary
        if: always()
        run: |
          if [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            {
              echo "## Production destroyed"
              echo ""
              echo "All production resources have been removed. Bill for production = \$0."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Production deployed"
              echo ""
              echo "| Resource | Value |"
              echo "|---|---|"
              echo "| App URL | http://$(terraform output -raw alb_dns_name 2>/dev/null) |"
              echo "| ECS cluster | $(terraform output -raw ecs_cluster_name 2>/dev/null) |"
              echo "| DB endpoint | $(terraform output -raw db_endpoint 2>/dev/null) |"
              echo "| App dashboard | $(terraform output -raw app_dashboard 2>/dev/null) |"
              echo "| DB dashboard | $(terraform output -raw db_dashboard 2>/dev/null) |"
              echo ""
              echo "Check health at http://$(terraform output -raw alb_dns_name 2>/dev/null)/health"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
